<!DOCTYPE html>
<!-- lang is hardcoded "en": the export's template-token replacement is
     first-occurrence-only, and the app ships English-only, so a literal
     language code is the reliable choice (a token left unreplaced would
     ship an invalid lang attribute). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- PWA wiring: a user-supplied public/index.html replaces Expo's
         default template for the web export (the CLI reads this file
         first when resolving the template), so the manifest link,
         theme-color and touch icon the default template lacks live
         here. The manifest itself is public/manifest.json; both are
         copied into the export root and served by the API server. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FCFCFC" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
